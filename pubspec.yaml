name: mossol
description: "모쏠 키우기 : 연애 시뮬레이션 게임"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  app_tracking_transparency: ^2.0.7
  characters: ^1.4.1
  firebase_analytics: ^12.6.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  google_mobile_ads: ^9.1.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/story/
    # 캐릭터 초상화. `<캐릭터 id>.png` 를 넣으면 이니셜 대신 그림이 뜬다(docs/PORTRAIT_PROMPTS.md).
    # 비어 있어도 빌드가 깨지지 않게 .gitkeep 을 둔다. 목록은 시작할 때 AssetManifest 로 읽는다.
    - assets/portraits/
    # OFL 라이선스 전문. 앱 안 라이선스 화면에서 읽어 줄 수 있게 함께 번들한다.
    - assets/fonts/Pretendard-LICENSE.txt

  # Pretendard (SIL Open Font License 1.1). 상업 배포 가능.
  # 굵기는 4종만 번들한다. 400/500/600/700 으로 본문·강조·타이틀을 모두 소화하고,
  # 그 밖의 굵기를 쓰면 iOS 가 합성해 버려 한글 획이 뭉개지므로 쓰지 않는다.
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
